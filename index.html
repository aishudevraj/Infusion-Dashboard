<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DripStop Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* keep all your root variables */
:root {
    --blue: #59A3BE;
    --blue-dark: #3F7E94;
    --bg: #F7FBFE;
    --card: #FFFFFF;
    --border: #E6EDF3;
    --text: #1C1C1C;
    --text-light: #6C7A89;
    --radius: 14px;
    --shadow: 0px 4px 14px rgba(0,0,0,0.05);
}

body {
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
}

/* NAVBAR (unchanged) */
.navbar {
    width: 100%;
    background: var(--blue);
    color: white;
    padding: 18px 32px;
    font-size: 24px;
    font-weight: 700;
    display: flex;
    align-items:center;
    justify-content:space-between;
}

/* ===================================  
   NEW SIDEBAR NAVIGATION MENU  
==================================== */
.sidebar {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px;
    width: 230px;
    height: fit-content;
    box-shadow: var(--shadow);
}

.sidebar-menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.menu-item {
    padding: 12px 16px;
    background: #F0F8FC;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 500;
}

.menu-item:hover {
    background: #D9EEF7;
}

.menu-item.active {
    background: var(--blue);
    color: white;
}

/* ===================================  
   MAIN CONTENT AREA  
==================================== */
.main {
    padding: 10px;
    display: none; /* all pages hidden by default */
}

.main.active {
    display: block;
}

/* Keep your existing card, table, graph and styles unchanged */
.card, .stats-grid, .table-card, .graph-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
}

.stats-grid {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
}

/* History page style */
.history-item {
    padding: 14px;
    margin: 8px 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #FFFFFF;
}

/* Live log window */
.log-box {
    height: 320px;
    overflow-y: auto;
    border:1px solid var(--border);
    padding:12px;
    border-radius:var(--radius);
    background:white;
    font-size:14px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    DripStop Dashboard
</div>

<!-- GRID LAYOUT -->
<div style="display:flex; gap:20px; padding:20px;">

    <!-- ========== NEW SIDEBAR MENU ========== -->
    <div class="sidebar">
        <div class="sidebar-menu">
            <div class="menu-item active" onclick="openPage('devices')">Devices</div>
            <div class="menu-item" onclick="openPage('history')">History</div>
            <div class="menu-item" onclick="openPage('status')">Status</div>
            <div class="menu-item" onclick="openPage('tracking')">Live Tracking</div>
        </div>
    </div>

    <!-- =======================================================
         MAIN CONTENT PAGES  
    ========================================================= -->

    <!-- PAGE 1: DEVICES -->
    <div id="page-devices" class="main active">
        <h2>Devices</h2>
        <div id="device-list"></div>
    </div>

    <!-- PAGE 2: HISTORY -->
    <div id="page-history" class="main">
        <h2>Device History</h2>
        <div id="history-container"></div>
    </div>

    <!-- PAGE 3: STATUS -->
    <div id="page-status" class="main">
        <h2>Device Status</h2>
        <table style="width:100%; border-collapse:collapse;">
            <thead>
                <tr style="background:var(--blue); color:white;">
                    <th>Device ID</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="status-body"></tbody>
        </table>
    </div>

    <!-- PAGE 4: LIVE TRACKING -->
    <div id="page-tracking" class="main">
        <h2>Live Tracking (Logs)</h2>
        <div id="log-window" class="log-box"></div>
    </div>

</div>

<script>

/* ===========================================================
   PAGE SWITCHING LOGIC (THIS IS WHAT ROHITH WANTS)
=========================================================== */

function openPage(name) {
    let pages = ["devices", "history", "status", "tracking"];
    pages.forEach(p => {
        document.getElementById("page-" + p).classList.remove("active");
    });
    document.getElementById("page-" + name).classList.add("active");

    // Change active sidebar highlight
    document.querySelectorAll(".menu-item").forEach(el => el.classList.remove("active"));
    event.target.classList.add("active");
}

/* ===========================================================
   DATA STRUCTURES (You already have this in Rohith’s JS)
=========================================================== */

let devices = {};   // Store device data
let logs = {};      // Log history per device

function ensureDevice(id) {
    if (!devices[id]) {
        devices[id] = { status:"OFFLINE", rate:0, drops:0 };
    }
    if (!logs[id]) logs[id] = [];
}

/* ===========================================================
   MQTT MESSAGE HANDLER (KEEP EXACT LOGIC)
=========================================================== */

function onMessageArrived(message) {
    // Parse MQTT
    let topic = message.destinationName;
    let payload = message.payloadString;

    let parts = topic.split("/");
    let id = parts[1];
    let field = parts[2];

    ensureDevice(id);

    if (field === "rate") devices[id].rate = payload;
    if (field === "drops") devices[id].drops = payload;
    if (field === "status") devices[id].status = payload;

    // Save in history log
    logs[id].push(`[${new Date().toLocaleTimeString()}] ${field}: ${payload}`);

    refreshUI();
}

/* ===========================================================
   REFRESH UI FOR ALL 4 PAGES
=========================================================== */

function refreshUI(){
    updateDeviceList();
    updateHistory();
    updateStatusTable();
    updateLogs();
}

/* PAGE 1: Devices */
function updateDeviceList(){
    let box = document.getElementById("device-list");
    box.innerHTML = "";

    Object.keys(devices).forEach(id => {
        let d = devices[id];
        box.innerHTML += `
            <div class="history-item">
                <strong>${id}</strong><br>
                Rate: ${d.rate} drops/min<br>
                Drops: ${d.drops}<br>
                Status: ${d.status}
            </div>`;
    });
}

/* PAGE 2: History */
function updateHistory(){
    let box = document.getElementById("history-container");
    box.innerHTML = "";

    Object.keys(logs).forEach(id => {
        box.innerHTML += `
            <div class="history-item">
                <strong>${id}</strong><br>
                ${logs[id].slice(-10).join("<br>")}
            </div>`;
    });
}

/* PAGE 3: Status */
function updateStatusTable(){
    let tbody = document.getElementById("status-body");
    tbody.innerHTML = "";

    Object.keys(devices).forEach(id => {
        tbody.innerHTML += `
            <tr>
                <td>${id}</td>
                <td>${devices[id].status}</td>
            </tr>`;
    });
}

/* PAGE 4: Live Tracking */
function updateLogs(){
    let box = document.getElementById("log-window");
    box.innerHTML = "";

    Object.keys(logs).forEach(id => {
        box.innerHTML += `<strong>${id}</strong><br>${logs[id].slice(-5).join("<br>")}<hr>`;
    });
}

</script>

</body>
</html>
